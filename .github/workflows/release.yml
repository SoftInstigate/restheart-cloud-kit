name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: integration-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      - name: Set version from tag
        run: |
          npm version ${{ github.ref_name }} --no-git-tag-version -w packages/kit
          npm version ${{ github.ref_name }} --no-git-tag-version -w packages/kit-ng
          # kit-ng bundles kit as a real dependency, so the two ship in lockstep.
          # Pin it to the exact tag: a caret range on a 0.x version does not span
          # minors, so leaving it stale makes npm resolve the previous kit from
          # the registry instead of linking the local workspace.
          npm pkg set dependencies.@restheart-cloud/kit=${{ github.ref_name }} -w packages/kit-ng

      - run: npm install

      - run: npm run build

      - run: mkdir -p packages/kit/test-results

      - name: Integration tests
        run: npm test -w @restheart-cloud/kit
        env:
          RH_TEST_API_URL: ${{ secrets.RH_TEST_API_URL }}
          RH_TEST_ADMIN_PASSWORD: ${{ secrets.RH_TEST_ADMIN_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/kit/test-results/

      - name: Publish
        if: success()
        run: |
          npm publish --access public -w packages/kit
          npm publish --access public packages/kit-ng/dist
