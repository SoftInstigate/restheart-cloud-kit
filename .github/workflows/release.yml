name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: integration-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      - name: Set version from tag
        # kit-ng bundles kit as a real dependency pinned to the exact version, so
        # the two ship in lockstep. All three values have to move together: bump
        # kit alone and the pin no longer matches the workspace, which sends npm
        # to the registry for a version that was never published.
        #
        # `npm pkg set` only edits package.json — unlike `npm version`, it does
        # not reify — so the tree is never momentarily inconsistent. The single
        # `npm install` below resolves it in one shot.
        run: |
          npm pkg set version=${{ github.ref_name }} -w packages/kit
          npm pkg set version=${{ github.ref_name }} -w packages/kit-ng
          npm pkg set dependencies.@restheart-cloud/kit=${{ github.ref_name }} -w packages/kit-ng

      - run: npm install

      - run: npm run build

      - run: mkdir -p packages/kit/test-results

      - name: Integration tests
        run: npm test -w @restheart-cloud/kit
        env:
          RH_TEST_API_URL: ${{ secrets.RH_TEST_API_URL }}
          RH_TEST_ADMIN_PASSWORD: ${{ secrets.RH_TEST_ADMIN_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/kit/test-results/

      - name: Publish
        if: success()
        run: |
          npm publish --access public -w packages/kit
          npm publish --access public packages/kit-ng/dist
